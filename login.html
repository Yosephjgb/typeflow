<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join TypeFlow | Auth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="auth-card glass-panel">
        <div style="text-align: center; margin-bottom: 30px;">
            <div class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px;">
                <i class="fas fa-bolt"></i>
                <span>TypeFlow</span>
            </div>
            <p style="color: var(--text-dim);" id="authSubtitle">Login to track your progress</p>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="input-group">
                <label for="logUser">Username</label>
                <input type="text" id="logUser" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="logPass">Password</label>
                <input type="password" id="logPass" placeholder="••••••••">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="auth.login()">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>
            <div class="auth-footer">
                Don't have an account? <a href="#" onclick="toggleAuth()">Create one</a>
            </div>
        </div>

        <!-- REGISTER FORM (Hidden by default) -->
        <div id="regForm" style="display: none;">
            <div class="input-group">
                <label for="regUser">New Username</label>
                <input type="text" id="regUser" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label for="regPass">Password</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="regConfirm">Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="••••••••">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="auth.register()">
                Create Account <i class="fas fa-user-plus"></i>
            </button>
            <div class="auth-footer">
                Already have an account? <a href="#" onclick="toggleAuth()">Sign in</a>
            </div>
        </div>

        <div id="authError" style="margin-top: 20px; color: var(--error); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleAuth() {
            const login = document.getElementById('loginForm');
            const reg = document.getElementById('regForm');
            const sub = document.getElementById('authSubtitle');
            const error = document.getElementById('authError');
            
            error.textContent = '';
            
            if (login.style.display === 'none') {
                login.style.display = 'block';
                reg.style.display = 'none';
                sub.textContent = 'Login to track your progress';
            } else {
                login.style.display = 'none';
                reg.style.display = 'block';
                sub.textContent = 'Create your free account';
            }
        }

        // Auto-switch based on URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'register') {
                toggleAuth();
            }
        });
    </script>
</body>
</html>
