<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join TypeFlow | Auth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="auth-card glass-panel">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px; text-decoration:none;">
                <i class="fas fa-bolt"></i>
                <span>TypeFlow</span>
            </a>
            <p style="color: var(--text-dim); margin-top:8px;" id="authSubtitle">Login to track your progress</p>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="input-group">
                <label for="logUser"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="logUser" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="logPass"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="logPass" placeholder="••••••••">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="auth.login()">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>
            <div style="text-align:center; margin-top: 12px;">
                <a href="#" onclick="showPanel('forgotForm')" style="color:var(--text-dim); font-size:0.85rem; text-decoration:none;">
                    <i class="fas fa-key"></i> Forgot your password?
                </a>
            </div>
            <div class="auth-footer">
                Don't have an account? <a href="#" onclick="showPanel('regForm')">Create one</a>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div id="regForm" style="display: none;">
            <div class="input-group">
                <label for="regUser"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="regUser" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label for="regEmail"><i class="fas fa-envelope"></i> Email <span style="color:var(--text-dim);font-size:0.8em;">(required for password reset)</span></label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label for="regPass"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="regConfirm"><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="••••••••">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="auth.register()">
                Create Account <i class="fas fa-user-plus"></i>
            </button>
            <div class="auth-footer">
                Already have an account? <a href="#" onclick="showPanel('loginForm')">Sign in</a>
            </div>
        </div>

        <!-- FORGOT PASSWORD FORM -->
        <div id="forgotForm" style="display: none;">
            <div style="text-align:center; margin-bottom:20px;">
                <div style="width:60px; height:60px; background:var(--primary-glow); border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--primary);">
                    <i class="fas fa-envelope"></i>
                </div>
                <p style="color:var(--text-dim); font-size:0.9rem;">
                    Enter your username or email address and we'll send you a password reset link.
                </p>
            </div>

            <div class="input-group">
                <label for="forgotIdentifier"><i class="fas fa-user"></i> Username or Email</label>
                <input type="text" id="forgotIdentifier" placeholder="Enter username or email">
            </div>

            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="doForgotPassword()">
                Send Reset Link <i class="fas fa-paper-plane"></i>
            </button>

            <div class="auth-footer">
                Remembered it? <a href="#" onclick="showPanel('loginForm')">Back to Login</a>
            </div>
        </div>

        <div id="authError"   style="margin-top: 15px; color: var(--error);   font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
        <div id="authSuccess" style="margin-top:  5px; color: var(--success); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const panels = ['loginForm', 'regForm', 'forgotForm'];
        const subtitles = {
            loginForm:  'Login to track your progress',
            regForm:    'Create your free account',
            forgotForm: 'Reset your password'
        };

        function showPanel(id) {
            panels.forEach(p => document.getElementById(p).style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.getElementById('authSubtitle').textContent = subtitles[id];
            document.getElementById('authError').textContent   = '';
            document.getElementById('authSuccess').textContent = '';
        }

        async function doForgotPassword() {
            const identifier = document.getElementById('forgotIdentifier').value.trim();
            const error      = document.getElementById('authError');
            const success    = document.getElementById('authSuccess');

            error.textContent   = '';
            success.textContent = '';

            if (!identifier) {
                error.textContent = 'Please enter your username or email.';
                return;
            }

            try {
                const res    = await fetch('auth.php?action=forgot_password', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ identifier })
                });
                const result = await res.json();

                if (result.success) {
                    success.textContent = '✅ ' + result.message;
                    document.getElementById('forgotIdentifier').value = '';
                } else {
                    error.textContent = result.message;
                }
            } catch (e) {
                error.textContent = 'Server error. Please try again.';
            }
        }

        // Auto-switch panel based on URL param
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'register') showPanel('regForm');
            if (params.get('mode') === 'forgot')   showPanel('forgotForm');
            if (params.get('redirect')) {
                document.getElementById('authError').textContent = '⚠️ Please log in to access that page.';
            }
        });

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const active = panels.find(p => document.getElementById(p).style.display !== 'none');
            if (active === 'forgotForm') doForgotPassword();
            else if (active === 'regForm') auth.register();
            else auth.login();
        });
    </script>
</body>
</html>
