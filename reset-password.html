<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TypeFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="auth-card glass-panel">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px; text-decoration: none;">
                <i class="fas fa-bolt"></i>
                <span>TypeFlow</span>
            </a>
            <p style="color: var(--text-dim); margin-top: 10px;">Reset your password</p>
        </div>

        <div class="input-group">
            <label for="resetUser"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="resetUser" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <label for="resetOldPass"><i class="fas fa-lock"></i> Current Password</label>
            <input type="password" id="resetOldPass" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label for="resetPass"><i class="fas fa-key"></i> New Password</label>
            <input type="password" id="resetPass" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label for="resetConfirm"><i class="fas fa-key"></i> Confirm New Password</label>
            <input type="password" id="resetConfirm" placeholder="••••••••">
        </div>

        <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="doReset()">
            Reset Password <i class="fas fa-shield-alt"></i>
        </button>

        <div id="authError" style="margin-top: 15px; color: var(--error); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
        <div id="authSuccess" style="margin-top: 5px; color: var(--success); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>

        <div class="auth-footer">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function doReset() {
            const user = document.getElementById('resetUser').value.trim().toLowerCase();
            const oldPass = document.getElementById('resetOldPass').value.trim();
            const newPass = document.getElementById('resetPass').value.trim();
            const confirm = document.getElementById('resetConfirm').value.trim();
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');

            error.textContent = '';
            success.textContent = '';

            if (!user || !oldPass || !newPass || !confirm) { error.textContent = "All fields are required."; return; }
            if (newPass.length < 6) { error.textContent = "New password must be at least 6 characters."; return; }
            if (newPass !== confirm) { error.textContent = "New passwords do not match."; return; }

            // First login to verify credentials, then update password
            try {
                const loginRes = await fetch('auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: oldPass })
                });
                const loginResult = await loginRes.json();
                if (!loginResult.success) { error.textContent = "Current password is incorrect."; return; }

                const res = await fetch('auth.php?action=update_profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
                });
                const result = await res.json();
                if (result.success) {
                    success.textContent = "Password reset! Redirecting to login...";
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    error.textContent = result.message;
                }
            } catch (e) {
                error.textContent = "Server error. Please try again.";
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doReset();
        });
    </script>
</body>
</html>
