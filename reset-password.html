<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TypeFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="auth-card glass-panel">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px; text-decoration: none;">
                <i class="fas fa-bolt"></i>
                <span>TypeFlow</span>
            </a>
            <p style="color: var(--text-dim); margin-top: 10px;">Choose a new password</p>
        </div>

        <!-- Invalid / missing token state -->
        <div id="invalidToken" style="display:none; text-align:center; padding: 20px 0;">
            <div style="font-size:3rem; margin-bottom:12px;">⚠️</div>
            <p style="color:var(--error); margin-bottom:20px;">
                This reset link is invalid or has expired.<br>
                Reset links are only valid for 1 hour.
            </p>
            <a href="login.html?mode=forgot" class="btn-primary" style="display:inline-flex; justify-content:center;">
                Request a New Link <i class="fas fa-paper-plane"></i>
            </a>
        </div>

        <!-- Reset form (shown when token is present in URL) -->
        <div id="resetForm">
            <div class="input-group">
                <label for="resetPass"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="resetPass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="resetConfirm"><i class="fas fa-lock"></i> Confirm New Password</label>
                <input type="password" id="resetConfirm" placeholder="••••••••">
            </div>

            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="doReset()">
                Set New Password <i class="fas fa-shield-alt"></i>
            </button>

            <div class="auth-footer">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>

        <div id="authError"   style="margin-top: 15px; color: var(--error);   font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
        <div id="authSuccess" style="margin-top:  5px; color: var(--success); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
    </div>

    <script src="script.js"></script>
    <script>
        let resetToken = null;

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            resetToken   = params.get('token');

            if (!resetToken) {
                document.getElementById('resetForm').style.display    = 'none';
                document.getElementById('invalidToken').style.display = 'block';
            }
        });

        async function doReset() {
            const newPass     = document.getElementById('resetPass').value.trim();
            const confirmPass = document.getElementById('resetConfirm').value.trim();
            const error       = document.getElementById('authError');
            const success     = document.getElementById('authSuccess');

            error.textContent   = '';
            success.textContent = '';

            if (!newPass || !confirmPass)  { error.textContent = 'Both fields are required.'; return; }
            if (newPass.length < 6)        { error.textContent = 'Password must be at least 6 characters.'; return; }
            if (newPass !== confirmPass)   { error.textContent = 'Passwords do not match.'; return; }

            try {
                const res    = await fetch('auth.php?action=reset_password', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ token: resetToken, newPassword: newPass, confirmPassword: confirmPass })
                });
                const result = await res.json();

                if (result.success) {
                    success.textContent = '✅ ' + result.message;
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    error.textContent = result.message;
                    // If token expired, show the invalid-token panel after a moment
                    if (result.message.includes('expired') || result.message.includes('invalid')) {
                        setTimeout(() => {
                            document.getElementById('resetForm').style.display    = 'none';
                            document.getElementById('invalidToken').style.display = 'block';
                            error.textContent = '';
                        }, 2500);
                    }
                }
            } catch (e) {
                error.textContent = 'Server error. Please try again.';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doReset();
        });
    </script>
</body>
</html>
