<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TypeFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="auth-card glass-panel">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px; text-decoration: none;">
                <i class="fas fa-bolt"></i>
                <span>TypeFlow</span>
            </a>
            <p style="color: var(--text-dim); margin-top: 10px;">Create your free account</p>
        </div>
        <div class="input-group">
            <label for="regUser"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="regUser" placeholder="Choose a username">
        </div>
        <div class="input-group">
            <label for="regEmail"><i class="fas fa-envelope"></i> Email (optional)</label>
            <input type="email" id="regEmail" placeholder="your@email.com">
        </div>
        <div class="input-group">
            <label for="regPass"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="regPass" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label for="regConfirm"><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="••••••••">
        </div>

        <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="doRegister()">
            Create Account <i class="fas fa-user-plus"></i>
        </button>

        <div id="authError" style="margin-top: 15px; color: var(--error); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>
        <div id="authSuccess" style="margin-top: 5px; color: var(--success); font-size: 0.85rem; text-align: center; min-height: 20px;"></div>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function doRegister() {
            const user = document.getElementById('regUser').value.trim().toLowerCase();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const confirm = document.getElementById('regConfirm').value.trim();
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');

            error.textContent = '';
            success.textContent = '';

            if (!user || !pass || !confirm) { error.textContent = "Username and password are required."; return; }
            if (pass.length < 6) { error.textContent = "Password must be at least 6 characters."; return; }
            if (pass !== confirm) { error.textContent = "Passwords do not match."; return; }
            try {
                const res = await fetch('auth.php?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass, email })
                });
                const result = await res.json();
                if (result.success) {
                    success.textContent = "Account created! Redirecting to login...";
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    error.textContent = result.message;
                }
            } catch (e) {
                error.textContent = "Server error. Please try again.";
            }
        }
       
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doRegister();
        });
    </script>
</body>
</html>
