<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | TypeFlow</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        .stat-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s;
        }

        /* UPDATE 1 */
        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);

            /* New Update */
            transform: translateY(-5px);
        }

        .stat-card-icon {
            font-size: 1.8rem;
            width: 50px;
            text-align: center;
        }

        .stat-card-value {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .stat-card-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        #achievementsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .tab-btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--surface-border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* UPDATE 2 */
        @media (max-width:768px){

            .dashboard-grid{
                display: flex;
                flex-direction: column;
            }

            .navbar{
                flex-direction: column;
                gap: 15px;
            }

            .nav-links{
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">

            <i class="fas fa-bolt"></i>

            <span>TypeFlow</span>

            <span id="userLabel"
            style="font-size:0.9rem;
            color:var(--text-dim);
            margin-left:15px;">

                <i class="fas fa-user-circle"></i>

                <span id="userNameSpan">
                    Player: Guest
                </span>

            </span>

        </div>

        <div class="nav-links">

            <a href="index.html"
            class="btn-outline">

                <i class="fas fa-keyboard"></i>
                Training

            </a>

            <a href="leaderboard.html"
            class="btn-outline">

                <i class="fas fa-trophy"></i>
                Leaderboard

            </a>

            <button id="logoutBtn"
            onclick="auth.logout()"
            class="btn-outline"
            style="display:none;">

                <i class="fas fa-sign-out-alt"></i>
                Logout

            </button>

        </div>

    </nav>

    <main class="main-container"
    style="max-width:1200px;">

        <div class="dashboard-grid">

            <!-- LEFT: Profile -->

            <div class="profile-card glass-panel">

                <div style="text-align:center; margin-bottom:25px;">

                    <div style="
                    width:90px;
                    height:90px;
                    background:var(--primary-glow);
                    border-radius:50%;
                    margin:0 auto 12px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:2.5rem;
                    color:var(--primary);
                    border:3px solid var(--primary);">

                        <i class="fas fa-user-astronaut"></i>

                    </div>

                    <h2 id="userName"
                    style="font-size:1.8rem; margin-bottom:6px;">

                        Player

                    </h2>

                    <span class="level-badge"
                    id="userLevel">

                        Level 1

                    </span>

                </div>

                <div class="xp-section"
                style="margin-bottom:25px;">

                    <div style="
                    display:flex;
                    justify-content:space-between;
                    font-size:0.8rem;
                    color:var(--text-dim);">

                        <span>XP Progress</span>

                        <span id="xpText">
                            0 / 1000
                        </span>

                    </div>

                    <div class="xp-bar-container">

                        <div class="xp-bar-fill"
                        id="xpFill"></div>

                    </div>

                </div>

                <!-- Quick Stats -->

                <div style="
                display:flex;
                flex-direction:column;
                gap:10px;
                margin-bottom:25px;">

                    <div class="stat-card">

                        <div class="stat-card-icon">⚡</div>

                        <div>

                            <div class="stat-card-value"
                            id="bestWpm"
                            style="color:var(--primary);">

                                0

                            </div>

                            <div class="stat-card-label">
                                Best WPM
                            </div>

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-card-icon">🎯</div>

                        <div>

                            <div class="stat-card-value"
                            id="bestAcc"
                            style="color:var(--secondary);">

                                0%

                            </div>

                            <div class="stat-card-label">
                                Best Accuracy
                            </div>

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-card-icon">📊</div>

                        <div>

                            <div class="stat-card-value"
                            id="avgWpm"
                            style="color:#f59e0b;">

                                0

                            </div>

                            <div class="stat-card-label">
                                Avg WPM
                            </div>

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-card-icon">🔥</div>

                        <div>

                            <div class="stat-card-value"
                            id="totalTests"
                            style="color:var(--success);">

                                0

                            </div>

                            <div class="stat-card-label">
                                Total Tests
                            </div>

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-card-icon">💫</div>

                        <div>

                            <div class="stat-card-value"
                            id="avgConsistency"
                            style="color:#a78bfa;">

                                0%

                            </div>

                            <div class="stat-card-label">
                                Avg Consistency
                            </div>

                        </div>

                    </div>

                </div>

                <a href="index.html"
                class="btn-primary"
                style="width:100%; justify-content:center;">

                    <i class="fas fa-play"></i>
                    Start Training

                </a>

            </div>

        </div>

    </main>

</body>
</html>
